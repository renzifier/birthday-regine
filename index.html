<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#000000" />
    <title>3D Birthday Scene</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="hint">
        <span class="hint-desktop"
          >drag to orbit and you can click the envelope</span
        ><span class="hint-mobile"
          >drag to orbit and you can click the envelope</span
        >
      </div>
    </div>

    <!-- ── Birthday music ── -->
    <audio
      id="bgMusic"
      src="assets/hindi mo lang alam.mp3"
      loop
      preload="auto"
    ></audio>

    <!-- ── Intro terminal ── -->
    <div id="introScreen">
      <div id="introTerminal">
        <div id="introLines"></div>
        <span id="introCursor">█</span>
      </div>
      <div id="continueHint">
        <span class="hint-desktop">— click anywhere to continue —</span>
        <span class="hint-mobile">— tap anywhere to continue —</span>
      </div>
    </div>

    <!-- ══════════════════════════════════════
         ENVELOPE OVERLAY
         Stage 1: closed envelope  (tap to open)
         Stage 2: flap opens       (animated)
         Stage 3: drag card out    (pointerdown/move/up)
    ═══════════════════════════════════════ -->
    <div id="envOverlay">
      <!-- Always-visible close button -->
      <button id="closeEnv" aria-label="Close">✕</button>

      <!-- Stages 1 & 2: the envelope itself -->
      <div id="envScene">
        <div id="envWrap">
          <!-- Card peeks above envelope — sits in envWrap above envVisual -->
          <div id="cardInEnv" role="img" aria-label="Birthday card">
            <img id="cardPullImg" alt="Birthday Card" draggable="false" />
          </div>

          <!-- envVisual holds all envelope parts at envelope dimensions -->
          <div id="envVisual">
            <!-- Flap — folds back on open (z:3) -->
            <div id="envFlapOuter">
              <div id="envFlap"></div>
            </div>

            <!-- Envelope back body (z:0) -->
            <div id="envBody">
              <!-- Inner lining — darker interior revealed when flap opens -->
              <div id="envInner">
                <div id="envInnerPattern"></div>
              </div>
            </div>
            <!-- Heart seal at flap/pocket crease — z:4, above all envelope layers -->
            <div id="envSeal" aria-hidden="true">♥</div>

            <!-- Front pocket — covers card bottom half (z:2) -->
            <div id="envPocket"></div>
          </div>
        </div>
        <p id="envHint" class="env-hint" aria-live="polite">tap to open</p>
      </div>

      <!-- Stage 3: full card view (after drag-out) -->
      <div id="cardFullView" aria-hidden="true">
        <img id="cardFullImg" alt="Birthday Card" />
        <p class="env-hint">press Esc · tap outside to close</p>
      </div>
    </div>
    <!-- /#envOverlay -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- ── Terminal intro script ── -->
    <script>
      (function () {
        const screen = document.getElementById("introScreen");
        const linesEl = document.getElementById("introLines");
        const cursor = document.getElementById("introCursor");

        const SCRIPT = [
          { text: "BIRTHDAY.EXE", cls: "dim", delay: 0, charDelay: 60 },
          { text: "", cls: "white", delay: 320, charDelay: 0 },
          {
            text: "> Initializing birthday sequence...",
            cls: "dim",
            delay: 180,
            charDelay: 28,
          },
          {
            text: "> Filling confettis......  OK",
            cls: "dim",
            delay: 120,
            charDelay: 22,
          },

            text: "> Lighting candles.............  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          {
            text: "> Baking cake..................  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          {
            text: "> Inflating balloons...........  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          {
            text: "> Sealing envelope.............  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          { text: "", cls: "white", delay: 280, charDelay: 0 },
          {
            text: "> Recipient found: MICHELLE",
            cls: "white",
            delay: 200,
            charDelay: 38,
          },
          { text: "", cls: "white", delay: 260, charDelay: 0 },
          {
            text: "💕💕💕  HAPPY BIRTHDAY  💕💕💕",
            cls: "bright",
            delay: 180,
            charDelay: 55,
          },
          { text: "", cls: "white", delay: 220, charDelay: 0 },
          {
            text: "  Hope your day is as amazing",
            cls: "pink",
            delay: 160,
            charDelay: 38,
          },
          { text: "  as you are! <3", cls: "pink", delay: 80, charDelay: 38 },
          { text: "", cls: "white", delay: 300, charDelay: 0 },
          {
            text: "> Opening your surprise...",
            cls: "dim",
            delay: 220,
            charDelay: 34,
          },
        ];

        let lineIndex = 0;

        function typeNextLine() {
          if (lineIndex >= SCRIPT.length) {
            cursor.style.display = "none";
            const hint = document.getElementById("continueHint");
            hint.style.display = "block";

            function dismiss() {
              const music = document.getElementById("bgMusic");
              music.play().catch(() => {});
              screen.classList.add("fade-out");
              setTimeout(() => {
                screen.style.display = "none";
              }, 1300);
            }

            screen.addEventListener("click", dismiss, { once: true });
            screen.addEventListener(
              "touchend",
              function (e) {
                e.preventDefault();
                dismiss();
              },
              { once: true, passive: false },
            );
            return;
          }

          const entry = SCRIPT[lineIndex];
          lineIndex++;

          setTimeout(() => {
            const span = document.createElement("span");
            span.className = "line " + entry.cls;
            linesEl.appendChild(span);
            linesEl.after(cursor);

            if (entry.charDelay === 0 || entry.text === "") {
              span.textContent = entry.text;
              typeNextLine();
            } else {
              let ci = 0;
              function typeChar() {
                if (ci < entry.text.length) {
                  span.textContent += entry.text[ci];
                  ci++;
                  setTimeout(
                    typeChar,
                    entry.charDelay +
                      (Math.random() * entry.charDelay * 0.4 -
                        entry.charDelay * 0.2),
                  );
                } else {
                  typeNextLine();
                }
              }
              typeChar();
            }
          }, entry.delay);
        }

        setTimeout(typeNextLine, 400);
      })();
    </script>

    <script type="module" src="assets/main.js"></script>
  </body>
</html>
