<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#000000" />
    <title>3D Birthday Scene</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <div id="wrap">
      <canvas id="c"></canvas>
      <div id="hint">
        <span class="hint-desktop"
          >drag to orbit · scroll to zoom · click the card 💌</span
        ><span class="hint-mobile"
          >drag to orbit · pinch to zoom · tap the card 💌</span
        >
      </div>
    </div>

    <!-- ── Birthday music — swap src for your audio file ── -->
    <audio
      id="bgMusic"
      src="assets/hindi mo lang alam.mp3"
      loop
      preload="auto"
    ></audio>
    <div id="introScreen">
      <div id="introTerminal">
        <div id="introLines"></div>
        <span id="introCursor">█</span>
      </div>
      <div id="continueHint">
        <span class="hint-desktop">— click anywhere to continue —</span>
        <span class="hint-mobile">— tap anywhere to continue —</span>
      </div>
    </div>

    <div id="cardOverlay">
      <div id="cardOverlayInner">
        <img id="cardImg" src="" alt="Birthday Card" />
        <button id="closeCard">✕</button>
        <span id="cardHint">press Esc or click outside to close</span>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- ── Terminal intro script ── -->
    <script>
      (function () {
        const screen = document.getElementById("introScreen");
        const linesEl = document.getElementById("introLines");
        const cursor = document.getElementById("introCursor");

        // ── Script to type out ──────────────────
        const SCRIPT = [
          { text: "BIRTHDAY.EXE", cls: "dim", delay: 0, charDelay: 60 },
          { text: "", cls: "white", delay: 320, charDelay: 0 },
          {
            text: "> Initializing birthday sequence...",
            cls: "dim",
            delay: 180,
            charDelay: 28,
          },
          {
            text: "> Loading lights......  OK",
            cls: "dim",
            delay: 120,
            charDelay: 22,
          },
          {
            text: "> Lighting candles.............  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          {
            text: "> Baking cake..................  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          {
            text: "> Inflating balloons...........  OK",
            cls: "dim",
            delay: 80,
            charDelay: 22,
          },
          { text: "", cls: "white", delay: 280, charDelay: 0 },
          {
            text: "> Recipient found: MICHELLE",
            cls: "white",
            delay: 200,
            charDelay: 38,
          },
          { text: "", cls: "white", delay: 260, charDelay: 0 },
          {
            text: "💕💕💕  HAPPY BIRTHDAY  💕💕💕",
            cls: "bright",
            delay: 180,
            charDelay: 55,
          },
          { text: "", cls: "white", delay: 220, charDelay: 0 },
          {
            text: "  Hope your day is as amazing",
            cls: "pink",
            delay: 160,
            charDelay: 38,
          },
          { text: "  as you are! <3", cls: "pink", delay: 80, charDelay: 38 },
          { text: "", cls: "white", delay: 300, charDelay: 0 },
          {
            text: "> Opening your surprise...",
            cls: "dim",
            delay: 220,
            charDelay: 34,
          },
        ];

        // Total time before scene reveals (ms after last line finishes)
        const HOLD_AFTER = 900;
        const FADE_DELAY = 300;

        let lineIndex = 0;

        function typeNextLine() {
          if (lineIndex >= SCRIPT.length) {
            // All lines done — show continue hint, wait for click/tap
            cursor.style.display = "none";
            const hint = document.getElementById("continueHint");
            hint.style.display = "block";

            function dismiss() {
              // Play audio on the user gesture — browsers require this
              const music = document.getElementById("bgMusic");
              music.play().catch(() => {}); // silently ignore if blocked
              screen.classList.add("fade-out");
              setTimeout(() => {
                screen.style.display = "none";
              }, 1300);
            }

            screen.addEventListener("click", dismiss, { once: true });
            screen.addEventListener(
              "touchend",
              function (e) {
                e.preventDefault();
                dismiss();
              },
              { once: true, passive: false },
            );
            return;
          }

          const entry = SCRIPT[lineIndex];
          lineIndex++;

          setTimeout(() => {
            const span = document.createElement("span");
            span.className = "line " + entry.cls;
            linesEl.appendChild(span);

            // Move cursor after this line's span
            linesEl.after(cursor);

            if (entry.charDelay === 0 || entry.text === "") {
              // Instant line
              span.textContent = entry.text;
              typeNextLine();
            } else {
              // Type character by character
              let ci = 0;
              function typeChar() {
                if (ci < entry.text.length) {
                  span.textContent += entry.text[ci];
                  ci++;
                  setTimeout(
                    typeChar,
                    entry.charDelay +
                      (Math.random() * entry.charDelay * 0.4 -
                        entry.charDelay * 0.2),
                  );
                } else {
                  typeNextLine();
                }
              }
              typeChar();
            }
          }, entry.delay);
        }

        // Kick off after a short boot pause
        setTimeout(typeNextLine, 400);
      })();
    </script>

    <!-- ES module entry point — all scene logic lives in assets/main.js -->
    <script type="module" src="assets/main.js"></script>
  </body>
</html>
